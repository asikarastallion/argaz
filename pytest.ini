[pytest]
testpaths = tests
python_files = test_*.py
# Tests import `conftest` and `sitl` as plain modules, and `argazui` from the
# package directory; conftest.py extends sys.path for the latter too, so the
# suite also runs when invoked from elsewhere.
pythonpath = tests tests/e2e argazui
addopts = -ra --strict-markers --durations=10
markers =
    tier1: real SITL, no Gazebo — verifies procedure logic only, never a model
    tier2: real SITL + Gazebo — the only tier that may verify a model
    e2e: the real server through HTTP/WebSocket and a real browser
log_cli_level = WARNING

# NOTE: there is deliberately no pytest-timeout dependency. Every flight is
# already bounded from two directions — each procedure carries its own
# `timeout:` ceiling, and `tests/sitl.py` gives up if SITL does not open its
# port — and the CI jobs set `timeout-minutes`. Adding a plugin to repeat that
# would be a dependency for nothing.
