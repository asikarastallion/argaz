# Build the test images and publish them to GHCR.
#
# WHY THIS IS A SEPARATE WORKFLOW
# -------------------------------
# The images compile ArduPilot from source. On the 4-core runner a public
# repository gets, that is tens of minutes — so it must not happen on every
# push. It happens when the recipe changes, and every other workflow *pulls*
# the result. `tier1.yml` then bind-mounts the checkout over the copy baked
# into the image, so what runs is that commit and not whatever was current
# when the image was built.
name: images

on:
  push:
    branches: [main]
    # The ArduPilot commit is pinned inside the Dockerfiles (ARDUPILOT_REF),
    # so changing it changes docker/** and rebuilds — which is the point of
    # pinning it there rather than in a workflow variable.
    paths:
      - 'docker/**'
      - 'argazui/requirements.txt'
      - 'argazui/requirements-test.txt'
      - '.github/workflows/images.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which image to build'
        type: choice
        options: [both, tier1, tier2]
        default: both

env:
  REGISTRY: ghcr.io

jobs:
  tier1:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.tier == 'both' || inputs.tier == 'tier1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A hosted runner ships with ~14 GB free and the tier-1 image is 5.5 GB
      # before its build cache. These directories are the largest things on it
      # that this build cannot use.
      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.tier1
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier1:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier1:${{ github.sha }}
          # Registry cache rather than type=gha: the ArduPilot layer alone is
          # bigger than the 10 GB GitHub Actions cache allowance, so a gha
          # cache would evict itself and never hit.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier1:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier1:buildcache,mode=max
          provenance: false

  tier2:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.tier == 'both' || inputs.tier == 'tier2'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The tier-2 image is 10.3 GB built locally. That is close enough to a
      # hosted runner's free space that the reclaim step is not optional, and
      # this job may still fail on disk. If it does, that is a real result:
      # see the note at the top of tier2.yml.
      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.tier2
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier2:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier2:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier2:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/argazui-tier2:buildcache,mode=max
          provenance: false
