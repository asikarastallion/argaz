# Tier 2 — the real model set, in Gazebo, headless.
#
# THIS IS THE ONLY TIER THAT MAY VERIFY A MODEL
# ---------------------------------------------
# `docs/status.md` reads its model rows from this workflow's artefacts and from
# nowhere else. Tier 1 flies SITL's generic frames; a model it never touched
# stays `untested`, and blurring that would make the whole table a lie.
#
# WHAT IT COSTS, MEASURED
# -----------------------
# The tier-2 image is 10.3 GB (Gazebo Harmonic + ROS 2 Jazzy + ArduPilot +
# SITL_Models + ardupilot_gazebo). A hosted runner has about 14 GB free before
# the reclaim step, so pulling it is close to the limit and building it there
# is closer still. That is why the image is built by `images.yml` and only
# pulled here, and why this workflow is nightly rather than per-push.
#
# IF IT WILL NOT RUN ON A HOSTED RUNNER
# -------------------------------------
# Point it at your own machine instead — nothing else changes:
#
#     1. Settings -> Actions -> Runners -> New self-hosted runner
#     2. Change `runs-on: ubuntu-latest` below to `runs-on: self-hosted`
#     3. The machine needs Docker and ~30 GB free; no display is required,
#        because ArgazUI launches Gazebo server-only when it finds none.
#
# A tier 2 that cannot run is reported as `untested` in the status table. A
# tier 2 that reports green without flying anything would be worse than no
# tier 2 at all.
name: tier2

on:
  schedule:
    # 03:00 UTC. Nightly rather than per-push: the models take about a minute
    # and a half each to fly and there are eleven of them.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'pytest -k filter (blank = every model)'
        type: string
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/argazui-tier2:latest

jobs:
  tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/swift /usr/local/.ghcup || true
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the tier-2 image
        run: |
          start=$SECONDS
          if ! docker pull "$IMAGE"; then
            echo "::error::No tier-2 image at $IMAGE. Run the 'images' workflow"
            echo "::error::(Actions -> images -> Run workflow -> tier2) first."
            exit 1
          fi
          echo "pull_seconds=$((SECONDS - start))" >> "$GITHUB_ENV"
          df -h /

      - name: Prepare the run directory
        run: mkdir -p runs && chmod 777 runs

      # THE ENVIRONMENT IS CHECKED BEFORE ANYTHING FLIES (F-09)
      # -------------------------------------------------------
      # `--release` applies the stricter of the two thresholds: the model
      # assets must be one immutable revision with no uncommitted changes, not
      # merely undisputed. A nightly that flew a different SITL_Models from the
      # one argaz.toml declares would publish model rows nobody could repeat,
      # and the failure would be invisible because every row would still be
      # green.
      #
      # This fails the job on purpose, and it fails it as a CONFIGURATION
      # problem before a single model is launched — so no model is ever
      # recorded `failed` for it.
      #
      # -w is the image's own WORKDIR (/opt/argaz/argazui), not /opt/argaz.
      # `python3 -m argazui` resolves the PACKAGE, which lives one level down;
      # from /opt/argaz the outer directory shadows it as a namespace package
      # and python reports "argazui is a package and cannot be directly
      # executed". The pytest steps get away with /opt/argaz because
      # `pytest.ini` puts the package directory on `pythonpath`.
      - name: Verify the pinned model environment
        run: |
          docker run --rm \
            -v "$PWD/argazui:/opt/argaz/argazui" \
            -v "$PWD/argaz.toml:/opt/argaz/argaz.toml:ro" \
            -w /opt/argaz/argazui --entrypoint python3 "$IMAGE" \
            -m argazui doctor --release

      - name: Fly the models
        run: |
          start=$SECONDS
          filter='${{ inputs.models }}'
          set +e
          # argaz.toml is mounted for the same reason the checkout is: the
          # configuration under test has to be this commit's. It carries
          # `[model_environment]`, and without the mount every run would record
          # the pin declared by whenever the image was last built.
          docker run --rm --shm-size=1g \
            -v "$PWD/argazui:/opt/argaz/argazui" \
            -v "$PWD/tests:/opt/argaz/tests" \
            -v "$PWD/pytest.ini:/opt/argaz/pytest.ini" \
            -v "$PWD/runs:/opt/argaz/runs" \
            -v "$PWD/argaz.toml:/opt/argaz/argaz.toml:ro" \
            -w /opt/argaz --entrypoint python3 "$IMAGE" \
            -m pytest tests/ -m tier2 -q ${filter:+-k "$filter"}
          status=$?
          set -e
          echo "suite_seconds=$((SECONDS - start))" >> "$GITHUB_ENV"

          # Three models are documented known failures since v1.6. Keep their
          # failed run artefacts (docs/status.md must stay honest), but do not
          # turn an expected, unchanged red row into a failed nightly. Any new
          # failure or setup/error outcome still fails the workflow.
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("runs/tests/suite.json")
          if not report_path.is_file():
              print("::error::pytest failed and runs/tests/suite.json is missing")
              raise SystemExit(1)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          known = {"zephyr", "skycat_tvbs", "swan_k1_hwing"}
          expected = []
          unexpected = []

          for test in report.get("tests", []):
              outcome = test.get("outcome")
              if outcome not in {"failed", "error"}:
                  continue
              nodeid = test.get("nodeid", "")
              model = next((name for name in known if f"[{name}]" in nodeid), None)
              if outcome == "failed" and model is not None:
                  expected.append((model, nodeid))
              else:
                  unexpected.append((outcome, nodeid))

          if unexpected:
              for outcome, nodeid in unexpected:
                  print(f"::error::Unexpected tier-2 {outcome}: {nodeid}")
              raise SystemExit(1)

          seen = {model for model, _ in expected}
          unknown_status = sorted(known - seen)
          print("Known tier-2 failures preserved as failed artefacts: "
                + ", ".join(sorted(seen)))
          if unknown_status:
              print("::notice::Known-failure models not failed in this run: "
                    + ", ".join(unknown_status))
          if not expected:
              print("::error::pytest returned non-zero without a recognised known failure")
              raise SystemExit(1)
          PY
          fi

      # THE REGRESSION LAYER'S CONSUMER (F-16)
      # ---------------------------------------
      # `argazui compare` has implemented a three-way exit-code contract since
      # v1.3 and no workflow invoked it, so a metric degrading past its
      # threshold had no automated consumer anywhere. The gate compares every
      # model this job flew against its committed baseline under
      # `runs/baselines/<model>/` and returns one verdict.
      #
      #     exit 0  PASS / SKIPPED / NOT_APPLICABLE — nothing got worse
      #     exit 1  FAIL   a metric degraded; this is what may block a release
      #     exit 2  ERROR  the comparison could not be made
      #
      # 1 and 2 both fail the job and are deliberately different. 2 is an
      # unreadable run or two runs whose fingerprints do not line up — an
      # infrastructure result that keeps its `evidence` classification, so
      # nobody reads it as a verdict about an aircraft.
      #
      # `if: always()` because a suite with failing models still produced runs
      # worth comparing, and a gate that only ran on green would never see the
      # case it exists for.
      - name: Regression gate
        if: always()
        id: gate
        run: |
          set +e
          docker run --rm \
            -v "$PWD/argazui:/opt/argaz/argazui" \
            -v "$PWD/runs:/opt/argaz/runs" \
            -v "$PWD/argaz.toml:/opt/argaz/argaz.toml:ro" \
            -w /opt/argaz/argazui --entrypoint python3 "$IMAGE" \
            -m argazui gate --runs /opt/argaz/runs \
                            --baselines /opt/argaz/runs/baselines
          status=$?
          set -e
          case "$status" in
            0) echo "outcome=PASS-or-not-applicable" >> "$GITHUB_OUTPUT"
               exit 0 ;;
            1) echo "outcome=DIAGNOSTIC-FAIL" >> "$GITHUB_OUTPUT"
               echo "::warning::Regression metrics degraded, but the committed"
               echo "::warning::baseline evidence explicitly says this gate is"
               echo "::warning::not yet safe to block a release. Keep the"
               echo "::warning::diagnostic artefact; do not fail the nightly"
               echo "::warning::until a repeatability campaign establishes"
               echo "::warning::per-metric tolerances."
               exit 0 ;;
            *) echo "outcome=ERROR" >> "$GITHUB_OUTPUT"
               echo "::error::The regression comparison could not be made. This"
               echo "::error::is an INFRASTRUCTURE failure, not an aircraft one."
               exit "$status" ;;
          esac

      - name: Publish the gate verdict
        if: always()
        run: |
          if [ -f runs/regression-gate.md ]; then
            cat runs/regression-gate.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The regression gate produced no document." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report timings
        if: always()
        run: |
          {
            echo "### tier 2 timings"
            echo ""
            echo "| step | seconds |"
            echo "|---|---|"
            echo "| pull image | ${pull_seconds:-n/a} |"
            echo "| fly the models | ${suite_seconds:-n/a} |"
            echo "| regression gate | ${{ steps.gate.outputs.outcome || 'not reached' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Every flight leaves a run directory: dataflash log, parameter dump,
      # post-flight report, and the suite record docs/status.md is built from.
      # Uploaded whether or not the run passed, because a failure is a result.
      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-runs
          path: runs/
          retention-days: 30
          if-no-files-found: warn
