# Regenerate docs/status.md, docs/coverage.md — and the README's
# STATUS-SUMMARY line — from the
# most recent test output.
#
# WHY A WORKFLOW AND NOT A HUMAN
# ------------------------------
# v1.0's README carried a hand-written table of supported models. Nothing
# produced those ticks except somebody's belief, and one of them was wrong for
# a year. The table is machine output now, and this is the machine.
#
# It runs after tier1 or tier2 finishes — including when they FAIL, because a
# failure is a result the table has to show. Both workflows' latest artefacts
# are pulled, so a tier-1-only run still refreshes the "what tier 1 verified"
# section without touching any model row.
name: status

on:
  workflow_run:
    workflows: [tier1, tier2]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The newest artefact from each workflow, whatever its conclusion. A
      # missing one is not an error: the generator reports what it has and
      # says so, rather than inventing a row.
      - name: Fetch the latest suite records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artefacts
          for wf in tier1 tier2; do
            id=$(gh run list --workflow "$wf.yml" --limit 1 \
                   --json databaseId,status \
                   -q '.[] | select(.status=="completed") | .databaseId')
            if [ -z "$id" ]; then
              echo "no completed $wf run yet"
              continue
            fi
            echo "$wf: run $id"
            gh run download "$id" -n "$wf-runs" -D "artefacts/$wf" \
              || echo "$wf run $id has no $wf-runs artefact"
          done
          find artefacts -name suite.json | sed 's/^/  found /'

      - name: Generate docs/status.md and docs/coverage.md
        env:
          PYTHONPATH: argazui
        run: |
          python3 -m argazui status \
            --runs artefacts/tier1 --runs artefacts/tier2 \
            --out docs/status.md \
            --workflow "status.yml" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo '### docs/status.md' >> "$GITHUB_STEP_SUMMARY"
          cat docs/status.md >> "$GITHUB_STEP_SUMMARY"
          # `argazui status` writes coverage.md from the SAME collection of
          # runs. Regenerating it separately could produce two answers, and the
          # status table's "what was NOT tested" summary has to agree with the
          # coverage report's full lists.
          echo '### docs/coverage.md' >> "$GITHUB_STEP_SUMMARY"
          cat docs/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit it if it changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # BOTH files this job rewrote. `argazui status` writes the table and
          # the one-line summary between README.md's STATUS-SUMMARY markers
          # from the same data; staging only the first left that line frozen at
          # its 2026-08-03 timestamp while the table moved on for two days.
          git add docs/status.md docs/coverage.md README.md
          if git diff --cached --quiet; then
            echo "the status table, the coverage report and the README summary "\
                 "are already current"
            exit 0
          fi
          # WHY [skip ci], AND WHY NOT A WIDER paths-ignore
          # -----------------------------------------------
          # This commit must not start the workflow that produced it, or the
          # pair never stops: tier1 completes -> status.yml fires on
          # workflow_run -> regenerates a fresh timestamp -> commits -> tier1
          # fires again. docs/** was enough while only the table was committed,
          # because tier1.yml ignores that path. README.md is not under it.
          #
          # [skip ci] is scoped to THIS commit: GitHub skips push-triggered
          # workflows for it, which is tier1 alone (tier2 is schedule-only, and
          # status.yml is workflow_run/dispatch-only, so neither is affected by
          # how this commit is worded). Adding README.md to tier1.yml's
          # paths-ignore would instead silence tests for every future human
          # README edit — a far larger change than this bug asks for.
          git commit -m "docs: regenerate status.md from CI output [skip ci]

          Generated by status.yml from the latest tier1 and tier2 artefacts.
          Covers docs/status.md, docs/coverage.md and README.md's
          STATUS-SUMMARY block. Do not edit any of them by hand.

          [skip ci] keeps this commit from re-triggering tier1, which would
          fire status.yml again through workflow_run and never settle."
          git push
