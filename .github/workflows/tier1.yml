# Tier 1 on every push and pull request.
#
# Real ArduPilot SITL, a real FastAPI server, a real browser — and no Gazebo.
# It verifies that the procedure logic, the HTTP/WebSocket layer and the page
# work. It verifies NOTHING about any Gazebo model; only tier 2 may do that,
# and `docs/status.md` keeps the two apart.
#
# The image is pulled, never built: compiling ArduPilot on every push would
# put this job an hour past its budget. The checkout is mounted over the copy
# baked into the image so the code under test is this commit.
name: tier1

on:
  push:
    # docs/** is ignored so that `status.yml` committing a regenerated
    # docs/status.md cannot start another tier-1 run, which would regenerate
    # it again. Nothing under docs/ can change a test result.
    #
    # That commit also touches README.md's STATUS-SUMMARY block, which is NOT
    # under docs/ and is deliberately not listed here: a human editing the
    # README should still run the tests. The bot's commit carries [skip ci]
    # instead, so the exemption is scoped to that one commit rather than to
    # the file. See status.yml's "Commit it if it changed" step.
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/argazui-tier1:latest

jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the tier-1 image
        run: |
          start=$SECONDS
          if ! docker pull "$IMAGE"; then
            echo "::error::No tier-1 image at $IMAGE. Run the 'images' workflow"
            echo "::error::(Actions -> images -> Run workflow) and retry this one."
            exit 1
          fi
          echo "pull_seconds=$((SECONDS - start))" >> "$GITHUB_ENV"
          docker image inspect "$IMAGE" --format 'image size: {{.Size}} bytes'

      # The suite writes run artefacts; give it a directory it owns.
      - name: Prepare the run directory
        run: mkdir -p runs && chmod 777 runs

      # WHY docs/, README.md AND CHANGELOG.md ARE MOUNTED
      # -------------------------------------------------
      # The documentation portal is an INDEX over this repository's own files:
      # 22 of its pages resolve to `docs/*.md`, `README.md`, `CHANGELOG.md` or
      # `TROUBLESHOOTING.md` — the last of these is the Turkish source for the
      # troubleshooting page, and it was written in Turkish first, so it is a
      # repository file rather than a translation of one
      # (see argazui/argazui/docs.py). The image COPYs argazui, tests,
      # pytest.ini and argaz.toml and nothing else, so inside the container
      # those files did not exist and every page that names one failed to
      # resolve.
      #
      # That is what the twelve `test_docs.py` / `test_docs_portal.py` failures
      # and the two `test_localisation.py` ones were: not a defect in the
      # portal, but the documentation it indexes being absent from the
      # environment asked to verify it. They were red from the release that
      # added the portal, which is a long time for a suite to carry fourteen
      # failures nobody could act on.
      #
      # Read-only, because the suite must not be able to edit the repository it
      # is verifying.
      #
      # `argaz.toml` IS baked into the image, and is mounted over anyway for the
      # same reason the checkout is: the configuration under test has to be this
      # commit's. v1.7 added `[model_environment]` to it, and without the mount
      # the suite would verify a pin declared by whenever the image was last
      # built — which is the class of staleness this project keeps finding.
      - name: Run the tier-1 suite
        run: |
          start=$SECONDS
          set +e
          docker run --rm \
            -v "$PWD/argazui:/opt/argaz/argazui" \
            -v "$PWD/tests:/opt/argaz/tests" \
            -v "$PWD/pytest.ini:/opt/argaz/pytest.ini" \
            -v "$PWD/runs:/opt/argaz/runs" \
            -v "$PWD/docs:/opt/argaz/docs:ro" \
            -v "$PWD/README.md:/opt/argaz/README.md:ro" \
            -v "$PWD/CHANGELOG.md:/opt/argaz/CHANGELOG.md:ro" \
            -v "$PWD/TROUBLESHOOTING.md:/opt/argaz/TROUBLESHOOTING.md:ro" \
            -v "$PWD/argaz.toml:/opt/argaz/argaz.toml:ro" \
            -w /opt/argaz --entrypoint python3 "$IMAGE" \
            -m pytest tests/ -m tier1 -q
          status=$?
          set -e
          echo "suite_seconds=$((SECONDS - start))" >> "$GITHUB_ENV"
          exit $status

      # THE DETERMINISTIC HALF OF THE REGRESSION LAYER, ON EVERY PUSH (F-16)
      # ---------------------------------------------------------------------
      # The audit's finding was that `argazui compare` had no automated
      # consumer at all. The gate that consumes it is a tier-2 step, because a
      # comparison needs a flight and tier 2 is where models fly.
      #
      # What CAN run on every push is everything about the comparison that does
      # not need an aircraft: the compatibility rules, the delta arithmetic and
      # its floors, the five gate outcomes, and — the part that matters most —
      # that an infrastructure error is not reported as a degraded aircraft.
      # Those are pure tests and they already run in the suite above; this step
      # runs them again by name so their result is EXPOSED rather than buried
      # in a total of six hundred.
      #
      # It costs about a second. A regression layer whose own semantics are
      # only checked nightly is a regression layer nobody notices breaking.
      - name: Deterministic regression verification
        if: always()
        run: |
          docker run --rm \
            -v "$PWD/argazui:/opt/argaz/argazui" \
            -v "$PWD/tests:/opt/argaz/tests" \
            -v "$PWD/pytest.ini:/opt/argaz/pytest.ini" \
            -v "$PWD/argaz.toml:/opt/argaz/argaz.toml:ro" \
            -v "$PWD/docker:/opt/argaz/docker:ro" \
            -w /opt/argaz --entrypoint python3 "$IMAGE" \
            -m pytest tests/test_regression.py tests/test_regression_gate.py \
                      tests/test_metric_semantics.py tests/test_fingerprint.py \
                      tests/test_model_pinning.py -q

      - name: Report timings
        if: always()
        run: |
          {
            echo "### tier 1 timings"
            echo ""
            echo "| step | seconds |"
            echo "|---|---|"
            echo "| pull image | ${pull_seconds:-n/a} |"
            echo "| run suite | ${suite_seconds:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The suite record is what docs/status.md is generated from, so it is
      # kept whether the run passed or failed — a failure is a result too.
      - name: Upload the suite record and run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-runs
          path: runs/
          retention-days: 14
          if-no-files-found: warn
